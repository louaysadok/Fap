name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  parser-tests:
    name: Scraper parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run parser self-test (no network required)
        run: ./gradlew :core:parserSelfTest --no-daemon

  apk:
    name: Build debug APK
    needs: parser-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Java first: the sdkmanager and Gradle both need it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/licenses"
          # Accept the SDK licenses up front so AGP can download anything missing.
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'd975f751698a77b662f1254ddbeed3901e976f5a\n' > "$SDK/licenses/intel-android-extra-license"
          ls "$SDK" || true
          ls "$SDK/platforms" || true
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Post the build log on the PR if it failed
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### APK build failed (\`${{ github.run_id }}\`)"
            echo '```'
            tail -150 build.log
            echo '```'
          } > report.md
          PR=$(gh pr list --head "${{ github.head_ref || github.ref_name }}" --json number --jq '.[0].number' || true)
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file report.md; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fapello-grabber-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
